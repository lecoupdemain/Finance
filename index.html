<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trésor Cohen</title>

<style>
/* --- VARIABLES & BASE --- */
:root {
    --safe-top: env(safe-area-inset-top, 0px);
    --green: #00ff88;
    --gold: #ffcc00;
    --red: #ff4444;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: calc(var(--safe-top) + 10px) 15px 30px;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: url("fond.jpg") no-repeat center center fixed;
    background-size: cover;
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* --- CARTES --- */
.card {
    background: rgba(0,0,0,0.85);
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
    z-index: 2;
}
@supports (backdrop-filter: blur(20px)) {
    .card {
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }
}

/* --- CHIENS & BULLES --- */
.dogs-container { position: relative; margin-bottom: 10px; }
.dogs-row { display: flex; justify-content: center; gap: 15px; }
.dog {
    width: 70px; height: 70px; border-radius: 50%;
    border: 3px solid var(--green); object-fit: cover; transition: 0.4s;
}
.dog.sad { filter: grayscale(100%) brightness(0.8); border-color: var(--red); }

.dog-bubble {
    position: absolute; top: -40px; left: 50%; transform: translateX(-50%) scale(0);
    background: white; color: black; padding: 8px 15px; border-radius: 15px;
    font-weight: bold; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; pointer-events: none;
    min-width: 140px;
}
.dog-bubble::after {
    content: ''; position: absolute; bottom: -6px; left: 50%; margin-left: -6px;
    border-width: 6px 6px 0; border-style: solid; border-color: white transparent transparent transparent;
}
.bubble-visible { transform: translateX(-50%) scale(1); }

/* --- COFFRE FORT --- */
.safe { cursor: pointer; user-select: none; padding: 10px; transition: transform 0.1s; }
.safe:active { transform: scale(0.95); }
.safe-value { font-size: 3rem; color: var(--gold); font-weight: 800; display: none; text-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
.safe-label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; font-weight: bold; margin-top: 5px; }
.date-display { color: #00d4ff; font-weight: bold; margin-bottom: 10px; text-transform: capitalize; }

/* --- BATTERIE & ALERTES --- */
.battery {
    height: 28px; border-radius: 12px; overflow: hidden;
    background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2);
    margin: 10px 0;
}
.battery-fill { height: 100%; width: 100%; background: var(--green); transition: width 0.5s ease; }

@keyframes blink { 0% { opacity: 1; background: #ff4444; } 50% { opacity: 0.5; background: #ff0000; } 100% { opacity: 1; background: #ff4444; } }
.battery-fill.critical { animation: blink 1s infinite; }

/* --- INPUTS (FLEX) --- */
.inputs { display: flex; gap: 10px; margin: 15px 0; width: 100%; }
.input-wrapper-price { flex: 0 0 35%; }
.input-wrapper-note { flex: 1; }

input {
    width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 1rem;
    background: rgba(255,255,255,0.9); color: black; -webkit-appearance: none;
}
input:focus { outline: 2px solid var(--green); background: white; }

/* --- BOUTONS --- */
button {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    font-weight: 800; font-size: 1rem; margin-bottom: 10px; cursor: pointer;
}
.btn-main { background: var(--green); color: #004422; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3); }
.btn-undo { background: rgba(255,159,10,0.15); color: #ff9f0a; border: 1px solid #ff9f0a; }

/* --- CASINO --- */
#slot-trigger {
    display: none; background: linear-gradient(135deg, #b8860b, #d93838); color: white;
    border: 3px solid var(--gold); animation: pulse 2s infinite; margin-top: 15px;
}
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

/* --- ANECDOTE --- */
.anecdote-box {
    margin-top: 15px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);
    font-style: italic; color: #ffeebb; font-size: 0.9rem; line-height: 1.4;
}

/* --- PARTICLES --- */
.particle { position: fixed; top: -50px; font-size: 24px; z-index: 9999; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* --- MODALS --- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; overflow-y: auto; padding: 20px; }
.close { position: fixed; top: 15px; right: 20px; font-size: 2.5rem; background: none; color: white; border: none; width: auto; }

.slot-container { background: #222; padding: 15px; border: 5px solid var(--gold); border-radius: 20px; display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.reel { width: 70px; height: 90px; background: white; border-radius: 10px; color: black; font-size: 40px; display: flex; justify-content: center; align-items: center; }
.grayscale { filter: grayscale(100%) opacity(0.5); }

</style>
</head>

<body>

<div class="card">
    <div class="dogs-container">
        <div id="dogBubble" class="dog-bubble">Wouf !</div>
        <div class="dogs-row">
            <img src="hurricane.png" class="dog" id="dog1">
            <img src="gears.png" class="dog" id="dog2">
            <img src="eira.png" class="dog" id="dog3">
        </div>
    </div>
    
    <div class="date-display" id="dateInfo"></div>

    <div class="safe" onclick="toggleSafe()">
        <div id="safeIcon" style="font-size:3.5rem;">🔐</div>
        <div class="safe-value" id="safeValue">0 €</div>
        <div class="safe-label" id="safeLabel">Coffre Secret (Gains)</div>
    </div>
</div>

<div class="card">
    <h3 id="remaining" style="font-size:1.4rem; margin:0 0 10px 0;">Reste : 80 €</h3>
    <div class="battery"><div class="battery-fill" id="battery"></div></div>

    <div class="inputs">
        <div class="input-wrapper-price">
            <input id="price" type="number" inputmode="decimal" placeholder="Prix">
        </div>
        <div class="input-wrapper-note">
            <input id="note" type="text" placeholder="C'était quoi ?">
        </div>
    </div>

    <button class="btn-main" onclick="addExpense()">VALIDER 🚀</button>
    <button class="btn-undo" onclick="undoExpense()">Oups, annuler ↩️</button>
    
    <div style="margin-top:10px;">
        <span onclick="toggleHistory(true)" style="color:#aaa; text-decoration:underline; font-size:0.85rem;">📜 Voir l'historique</span>
    </div>

    <button id="slot-trigger" onclick="openSlot()">🎰 CASINO DU SAMEDI !</button>
    <div id="countdown" style="font-family:monospace; color:#00d4ff; font-size:0.9rem; margin-top:15px;">--j --h avant le Casino</div>

    <div class="anecdote-box" id="anecdote"></div>
</div>

<div class="modal" id="historyModal">
    <button class="close" onclick="toggleHistory(false)">×</button>
    <h2 style="color:#00d4ff;">Derniers Achats</h2>
    <div id="historyList"></div>
</div>

<div class="modal" id="slotModal" style="display:none; justify-content:center; align-items:center;">
    <div style="text-align:center; width:100%;">
        <h2 style="color:var(--gold); font-size:2rem; margin-bottom:10px;">JACKPOT +10€</h2>
        <div class="slot-container" id="slotMachine">
            <div class="reel" id="r1">❓</div>
            <div class="reel" id="r2">❓</div>
            <div class="reel" id="r3">❓</div>
        </div>
        <button id="spinBtn" class="btn-main" style="background:var(--gold); color:black;" onclick="spin()">TIRER LE LEVIER !</button>
        <p id="slotMsg" style="min-height:30px; font-weight:bold; font-size:1.1rem;"></p>
        <button onclick="document.getElementById('slotModal').style.display='none'" style="background:none; color:#aaa; text-decoration:underline;">Fermer</button>
    </div>
</div>

<script>
const STORAGE_KEY = "cohen_ultimate_fun_v1"; 
const WEEKLY_LIMIT = 80;

// --- ETAT INITIAL ---
let state;
try {
    state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        spent: 0,
        treasure: 0, // Cagnotte séparée
        history: [],
        lastBonusDate: null
    };
} catch {
    state = { spent: 0, treasure: 0, history: [], lastBonusDate: null };
}

let safeOpen = false;

// --- DONNÉES FUN ---
const dogMessages = ["T'inquiète !", "On gère !", "Validé !", "Miam !", "On t'aime", "Gears surveille", "Wouf !"];
const anecdotes = [
    "L'empreinte de la truffe d'un chien est unique, comme une empreinte digitale.",
    "Les chiens sentent le temps qui passe grâce à la baisse de ton odeur dans la maison.",
    "Si Gears remue la queue à droite = Content. À gauche = Inquiet.",
    "Les chiens comprennent environ 165 mots (comme un bébé de 2 ans).",
    "Leurs coussinets sentent le pop-corn à cause d'une bactérie naturelle.",
    "Le bâillement contagieux prouve l'empathie de ton chien pour toi.",
    "Ils entendent 4x plus loin que nous.",
    "Ils voient en bleu et jaune, pas en noir et blanc.",
    "Caresser un chien baisse ta tension artérielle.",
    "Ton odeur active la zone du plaisir dans leur cerveau.",
    "Ils dorment en boule pour protéger leurs organes vitaux (instinct de loup).",
    "Les moustaches leur permettent de 'voir' dans le noir via les courants d'air.",
    "Boire de l'eau c'est la vie (et c'est gratuit).",
    "Le chien est le seul être qui t'aime plus que lui-même.",
    "Regarder un chien dormir est la meilleure thérapie.",
    "Les chiens ont 3 paupières.",
    "La nuit, leurs yeux brillent grâce à un miroir naturel derrière la rétine.",
    "Ils localisent un bruit en 0.06 secondes.",
    "Ils transpirent seulement par les pattes.",
    "Le chocolat est non, mais la carotte est oui !",
    "Un chien adulte a 42 dents (toi 32).",
    "Gérer son budget, c'est s'offrir de la sérénité.",
    "Le plus vieux chien a vécu 29 ans.",
    "Ils n'aiment pas qu'on leur touche le dessus de la tête (signe de dominance).",
    "S'appuyer contre toi = Câlin de protection.",
    "Les dalmatiens naissent blancs.",
    "Ils peuvent apprendre à compter jusqu'à 5.",
    "La truffe humide capte mieux les odeurs.",
    "Ils rêvent de lapins quand ils bougent les pattes.",
    "Investir en soi est le meilleur rendement.",
    "Tu es la personne préférée de ton chien.",
    "Les oreilles de Gears ont 18 muscles.",
    "L'obésité est l'ennemi n°1. Moins de friandises = plus de santé.",
    "La danse du popotin = Joie extrême.",
    "Planifier les repas fait économiser gros.",
    "L'achat impulsif dure 5 min, l'épargne dure toujours.",
    "Ils préfèrent les voix aigües.",
    "Le contact visuel libère de l'ocytocine (hormone de l'amour).",
    "Un chien fatigué est un chien heureux.",
    "Ne jamais faire les courses le ventre vide.",
    "Ils peuvent être gauchers ou droitiers.",
    "Le ronflement canin est une berceuse.",
    "Règle des 24h : attends avant d'acheter un truc cher.",
    "Ils sentent la maladie.",
    "L'argent achète les croquettes, donc c'est important.",
    "Faire ses comptes, c'est être libre.",
    "Vis l'instant présent comme eux.",
    "Un café maison coûte 10x moins cher qu'en terrasse.",
    "Demande-toi : Hurricane validerait-il cet achat ?",
    "Bonheur = Soleil + Chien + Compte positif.",
    "Les petits chiens vivent plus longtemps.",
    "Tu es leur univers.",
    "La fidélité d'un chien est éternelle.",
    "Un chien ne juge jamais tes dépenses, mais il aime quand tu es zen.",
    "Promener le chien est la salle de sport la moins chère.",
    "Ils savent quand tu es triste avant même que tu pleures.",
    "Leur amour ne coûte rien, mais il vaut tout.",
    "Chaque jour est une nouvelle chance de bien gérer.",
    "Bravo, tu es une super gestionnaire !",
    "Fin de la liste, on recommence au début !"
];

// --- UI UPDATE ---
function updateUI() {
    const now = new Date();
    document.getElementById("dateInfo").textContent = now.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
    
    // Budget Semaine
    const remaining = Math.max(0, WEEKLY_LIMIT - state.spent);
    document.getElementById("remaining").textContent = `Reste : ${remaining.toFixed(2)} €`;

    // Batterie
    const percent = Math.min(100, (remaining / WEEKLY_LIMIT) * 100);
    const bat = document.getElementById("battery");
    bat.style.width = percent + "%";
    
    // Couleurs & Alerte
    bat.className = "battery-fill"; // Reset
    bat.style.background = "#ffcc00"; // Jaune par défaut
    if(percent > 50) bat.style.background = "#00ff88"; // Vert
    if(remaining <= 20) {
        bat.className = "battery-fill critical"; // Rouge Clignotant
    }

    // Coffre (Cagnotte)
    document.getElementById("safeValue").textContent = `${Math.round(state.treasure)} €`;

    // Chiens Tristes ?
    document.querySelectorAll(".dog").forEach(d => d.classList.toggle("sad", remaining <= 0));

    // Anecdote du jour (Jour de l'année)
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay);
    document.getElementById("anecdote").textContent = "💡 " + anecdotes[dayOfYear % anecdotes.length];

    // Logique Casino Samedi
    const isSaturday = now.getDay() === 6;
    const todayStr = now.toLocaleDateString();
    
    if(isSaturday && remaining > 0 && state.lastBonusDate !== todayStr) {
        document.getElementById("slot-trigger").style.display = "block";
        document.getElementById("countdown").style.display = "none";
    } else {
        document.getElementById("slot-trigger").style.display = "none";
        document.getElementById("countdown").style.display = "block";
        updateCountdown();
    }
}

// --- LOGIQUE METIER ---
function addExpense() {
    const priceInput = document.getElementById("price");
    const noteInput = document.getElementById("note");
    const value = parseFloat(priceInput.value.replace(",", "."));

    if (!Number.isFinite(value) || value <= 0) return;

    state.spent += value;
    state.history.push({
        amount: value,
        note: noteInput.value || "Dépense",
        date: new Date().toLocaleString("fr-FR", {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'})
    });

    priceInput.value = "";
    noteInput.value = "";
    save();
    
    // Effets Fun
    spawnParticles(['💸','🪙','🦴']);
    showDogBubble();
}

function undoExpense() {
    if (!state.history.length) return;
    if(confirm("Annuler la dernière dépense ?")) {
        const last = state.history.pop();
        state.spent -= last.amount;
        save();
    }
}

function toggleSafe() {
    safeOpen = !safeOpen;
    const icon = document.getElementById("safeIcon");
    const val = document.getElementById("safeValue");
    const label = document.getElementById("safeLabel");

    if (safeOpen) {
        icon.style.display = "none";
        val.style.display = "block";
        label.innerText = "Cagnotte Disponible";
        label.style.color = "#ffcc00";
    } else {
        icon.style.display = "block";
        val.style.display = "none";
        label.innerText = "Coffre Secret (Gains)";
        label.style.color = "#aaa";
    }
}

// --- FONCTIONS FUN ---
function showDogBubble() {
    const b = document.getElementById("dogBubble");
    b.innerText = dogMessages[Math.floor(Math.random() * dogMessages.length)];
    b.classList.add("bubble-visible");
    setTimeout(() => b.classList.remove("bubble-visible"), 3000);
}

function spawnParticles(chars) {
    for(let i=0; i<30; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.innerText = chars[Math.floor(Math.random()*chars.length)];
        p.style.left = Math.random() * 100 + "vw";
        p.style.animationDuration = (Math.random() * 2 + 1) + "s";
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3000);
    }
}

// --- CASINO ---
function openSlot() {
    document.getElementById("slotModal").style.display = "flex";
}

function spin() {
    const symbols = ['🐶','💎','💰','🦴'];
    const btn = document.getElementById("spinBtn");
    const msg = document.getElementById("slotMsg");
    const reels = [document.getElementById("r1"), document.getElementById("r2"), document.getElementById("r3")];

    btn.disabled = true;
    btn.style.opacity = 0.5;
    msg.innerText = "Suspense...";
    document.getElementById("slotMachine").classList.remove("grayscale");

    let count = 0;
    let interval = setInterval(() => {
        reels.forEach(r => r.innerText = symbols[Math.floor(Math.random()*symbols.length)]);
        count++;
        if(count > 25) {
            clearInterval(interval);
            const res = reels.map(r => r.innerText);
            
            if(res[0] === res[1] && res[1] === res[2]) {
                msg.innerText = "🥳 JACKPOT ! +10€ DANS LE COFFRE !";
                msg.style.color = "#00ff88";
                state.treasure += 10;
                spawnParticles(['🥳','🎉','✨']);
            } else {
                msg.innerText = "😢 Pas cette fois... Mais on t'aime !";
                msg.style.color = "#ffaaaa";
                document.getElementById("slotMachine").classList.add("grayscale");
            }
            
            state.lastBonusDate = new Date().toLocaleDateString();
            save();
            btn.disabled = false;
            btn.style.opacity = 1;
        }
    }, 80);
}

// --- HISTORIQUE & TIMERS ---
function toggleHistory(show) {
    document.getElementById("historyModal").style.display = show ? "block" : "none";
    if(show) {
        const list = document.getElementById("historyList");
        if(state.history.length === 0) list.innerHTML = "<p style='color:#aaa; text-align:center;'>Rien pour l'instant.</p>";
        else {
            let html = "";
            state.history.slice().reverse().forEach(item => {
                html += `<div style="background:rgba(255,255,255,0.1); padding:10px; margin-bottom:10px; border-radius:10px; display:flex; justify-content:space-between;">
                    <div><b>${item.note}</b><br><small style='color:#ccc'>${item.date}</small></div>
                    <div style='color:#ff4444; font-weight:bold;'>-${item.amount}€</div>
                </div>`;
            });
            list.innerHTML = html;
        }
    }
}

function updateCountdown() {
    const now = new Date();
    let next = new Date();
    next.setDate(now.getDate() + (6 - now.getDay() + 7) % 7);
    next.setHours(0,0,0,0);
    if(now.getDay() === 6) next.setDate(now.getDate() + 7);
    
    const diff = next - now;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 8640000
