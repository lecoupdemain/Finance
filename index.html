<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Trésor Cohen</title>
    <style>
        :root { --safe-top: env(safe-area-inset-top); }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: url('fond.jpg') no-repeat center center fixed;
            background-size: cover; color: white; text-align: center; margin: 0; 
            padding: calc(var(--safe-top) + 10px) 15px 20px 15px; min-height: 100vh;
        }
        .card { 
            background: rgba(0, 0, 0, 0.6); border-radius: 20px; padding: 15px; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .dogs-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 10px; }
        .dog-thumb { width: 70px; height: 70px; border-radius: 50%; border: 3px solid white; object-fit: cover; }
        .sad-dog { filter: grayscale(100%); transform: scale(0.9); }
        .current-date { font-size: 1rem; font-weight: 600; color: #00d4ff; margin-bottom: 5px; text-transform: capitalize; }
        .treasure-val { font-size: 3rem; color: #00ff88; font-weight: 800; margin: 0; }
        
        .battery-container { border: 1.5px solid #888; border-radius: 12px; height: 30px; margin: 12px 0; background: rgba(0,0,0,0.4); overflow: hidden; }
        .battery-fill { background: #00ff88; height: 100%; width: 100%; transition: width 0.6s; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input { padding: 16px; border-radius: 14px; border: none; font-size: 18px !important; color: black; background: white; width: 100%; box-sizing: border-box; }
        #expense { flex: 2; text-align: center; }
        #note { flex: 3; }
        
        .btn-valider { width: 100%; padding: 18px; border-radius: 14px; border: none; background: #00ff88; color: #1a1a1a; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        .btn-undo { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ff9f0a; background: rgba(255, 159, 10, 0.2); color: #ff9f0a; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; }
        .btn-history { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-size: 0.8rem; }
        
        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; overflow-y: auto; padding-top: 50px; }
        .history-content { padding: 20px; text-align: left; }
        .history-item { border-bottom: 1px solid #444; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .close-hist { position: fixed; top: 20px; right: 20px; font-size: 2.5rem; color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="dogs-row">
            <img src="hurricane.png" id="img-hurricane" class="dog-thumb">
            <img src="gears.png" id="img-gears" class="dog-thumb">
            <img src="eira.png" id="img-eira" class="dog-thumb">
        </div>
        <div id="display-date" class="current-date"></div>
        <div class="treasure-val" id="total-display">0 €</div>
        <div id="countdown" style="font-size: 0.8rem; color: #aaa;"></div>
    </div>

    <div class="card">
        <h3 id="weekly-label" style="margin: 0;">Reste : 80 €</h3>
        <div class="battery-container"><div class="battery-fill" id="battery"></div></div>
        <div id="dog-message" style="margin-bottom: 12px; font-weight: 500;"></div>
        
        <div class="input-group">
            <input type="number" id="expense" placeholder="Prix €" inputmode="decimal">
            <input type="text" id="note" placeholder="Où ?">
        </div>
        
        <button class="btn-valider" onclick="addExpense()">VALIDER L'ACHAT</button>
        
        <button class="btn-undo" onclick="undoLast()">↩️ ERREUR ? ANNULER LE DERNIER</button>
        <button class="btn-history" onclick="toggleHistory(true)">📜 VOIR L'HISTORIQUE COMPLET</button>
    </div>

    <div id="history-modal">
        <span class="close-hist" onclick="toggleHistory(false)">×</span>
        <div class="history-content">
            <h2 style="color:#00d4ff">Toutes les dépenses</h2>
            <div id="full-history-list"></div>
        </div>
    </div>

    <script>
        let storageKey = 'cohen_sasu_v1';
        let data = JSON.parse(localStorage.getItem(storageKey)) || {
            totalTreasure: 125, // On démarre avec 125€ au lieu de 0
            currentSpend: 0,
            history: [],
            lastResetWeek: null
        };

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            return Math.ceil((((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 1))) / 86400000) + 1) / 7);
        }

        function checkAutoReset() {
            let now = new Date();
            let currentWeek = getWeekNumber(now) + "-" + now.getFullYear();
            if (data.lastResetWeek !== currentWeek) {
                if (data.lastResetWeek !== null) {
                    data.totalTreasure += 125;
                    data.currentSpend = 0;
                }
                data.lastResetWeek = currentWeek;
                save();
            }
        }

        function save() { localStorage.setItem(storageKey, JSON.stringify(data)); updateDisplay(); }

        function updateDisplay() {
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('display-date').innerText = new Date().toLocaleDateString('fr-FR', options);
            document.getElementById('total-display').innerText = Math.round(data.totalTreasure) + " €";
            
            let remaining = Math.max(0, 80 - data.currentSpend);
            document.getElementById('weekly-label').innerText = "Reste : " + remaining.toFixed(2) + " €";
            document.getElementById('battery').style.width = (remaining / 80 * 100) + "%";
            
            let dogs = [document.getElementById('img-hurricane'), document.getElementById('img-gears'), document.getElementById('img-eira')];
            let msg = document.getElementById('dog-message');
            
            if (remaining > 40) { msg.innerText = "✨ Tout est parfait !"; dogs.forEach(d => d.classList.remove('sad-dog')); }
            else if (remaining > 0) { msg.innerText = "🧐 On surveille le budget..."; dogs.forEach(d => d.classList.remove('sad-dog')); }
            else { msg.innerText = "😱 Hurricane est triste !"; dogs.forEach(d => d.classList.add('sad-dog')); }

            let histHtml = "";
            data.history.slice().reverse().forEach(item => {
                histHtml += `<div class="history-item"><div><b>${item.date}</b><br><small>${item.note}</small></div><div style="color:#ff4444">-${item.amount}€</div></div>`;
            });
            document.getElementById('full-history-list').innerHTML = histHtml || "Aucune dépense";
            
            const end = new Date("December 31, 2026").getTime();
            const days = Math.floor((end - new Date().getTime()) / (1000 * 60 * 60 * 24));
            document.getElementById('countdown').innerText = "⏳ Liberté : " + days + " jours";
        }

        function addExpense() {
            let p = document.getElementById('expense');
            let n = document.getElementById('note');
            let val = parseFloat(p.value);
            if (val > 0) {
                let now = new Date();
                data.currentSpend += val;
                data.totalTreasure -= val; // On déduit aussi du trésor global
                data.history.push({
                    amount: val, 
                    note: n.value || "Courses", 
                    date: now.toLocaleDateString('fr-FR') + " " + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})
                });
                p.value = ""; n.value = ""; p.blur(); n.blur();
                save();
            }
        }

        function undoLast() {
            if (data.history.length > 0) {
                let last = data.history[data.history.length - 1];
                if (confirm("Effacer l'achat de " + last.amount + "€ à " + last.note + " ?")) {
                    data.currentSpend -= parseFloat(last.amount);
                    data.totalTreasure += parseFloat(last.amount);
                    data.history.pop();
                    save();
                }
            } else {
                alert("Rien à annuler !");
            }
        }

        function toggleHistory(show) { document.getElementById('history-modal').style.display = show ? 'block' : 'none'; }

        checkAutoReset();
        updateDisplay();
    </script>
</body>
</html>
