<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Trésor Cohen</title>
    <style>
        :root { --safe-top: env(safe-area-inset-top); }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: url('fond.jpg') no-repeat center center fixed;
            background-size: cover; color: white; text-align: center; margin: 0; 
            padding: calc(var(--safe-top) + 10px) 15px 20px 15px; min-height: 100vh;
            overflow-x: hidden;
        }
        .card { 
            background: rgba(0, 0, 0, 0.75); border-radius: 25px; padding: 15px; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            position: relative; z-index: 2;
        }
        .treasure-val { font-size: 3.5rem; color: #00ff88; font-weight: 900; margin: 0; }
        .battery-container { border: 2px solid rgba(255,255,255,0.3); border-radius: 15px; height: 35px; margin: 15px 0; background: rgba(0,0,0,0.5); overflow: hidden; }
        .battery-fill { height: 100%; width: 100%; transition: width 0.8s; background: #00ff88; }
        
        #slot-trigger { 
            display: none; width: 100%; padding: 18px; border-radius: 18px; border: 3px solid #ffcc00;
            background: linear-gradient(45deg, #d4af37, #f44336); color: white; font-weight: 900;
            margin-top: 10px; animation: pulse 1.5s infinite; font-size: 1.1rem;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .anecdote-box { font-size: 0.9rem; font-style: italic; color: #ffcc00; margin-top: 10px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        .countdown-timer { font-family: monospace; font-size: 1.1rem; color: #00d4ff; font-weight: bold; margin: 10px 0; }
        
        #slot-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .slot-machine { background: #333; padding: 25px; border: 6px solid #ffcc00; border-radius: 20px; display: flex; gap: 15px; margin-bottom: 25px; }
        .reel { background: #eee; width: 70px; height: 90px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 45px; color: black; }
        
        .coin { position: fixed; top: -50px; font-size: 24px; z-index: 1; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .btn-valider { width: 100%; padding: 20px; border-radius: 18px; border: none; background: #00ff88; color: #1a1a1a; font-weight: 900; font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="card">
        <div id="date-info" style="font-size: 0.9rem; color: #00d4ff; font-weight: bold;"></div>
        <div class="treasure-val" id="total-display">0 €</div>
        <div id="grade" style="padding: 5px 15px; border-radius: 20px; display: inline-block; background: #00ff88; color: #000; font-weight: bold; font-size: 0.8rem; margin-top: 10px;">👑 Gestionnaire d'Élite</div>
    </div>

    <div class="card">
        <h3 id="weekly-label" style="margin: 0; font-size: 1.5rem;">Reste : 80 €</h3>
        <div class="battery-container"><div class="battery-fill" id="battery"></div></div>
        
        <input type="number" id="expense" placeholder="Prix €" style="width:90%; padding:18px; border-radius:15px; border:none; margin-bottom:12px;" inputmode="decimal">
        <button class="btn-valider" onclick="addExpense()">VALIDER L'ACHAT 🚀</button>
        
        <button id="slot-trigger" onclick="openSlot()">🎰 CASINO DU SAMEDI OUVERT !</button>
        
        <div id="countdown-area">
            <div style="font-size: 0.8rem; color: #aaa; margin-top: 15px;">⏳ Ouverture du Casino dans :</div>
            <div id="timer" class="countdown-timer">00j 00h 00m 00s</div>
        </div>

        <div id="anecdote" class="anecdote-box"></div>
    </div>

    <div id="slot-modal">
        <h2 style="color:#ffcc00; font-size: 2rem;">JACKPOT +10€</h2>
        <div class="slot-machine">
            <div id="r1" class="reel">❓</div>
            <div id="r2" class="reel">❓</div>
            <div id="r3" class="reel">❓</div>
        </div>
        <button id="spin-btn" onclick="spin()" style="padding:20px 50px; border-radius:40px; border:none; background:#ffcc00; color:#000; font-weight:900; font-size:1.4rem;">TIRER LE LEVIER !</button>
        <button onclick="closeSlot()" style="margin-top:30px; background:none; border:none; color:white; text-decoration:underline;">Fermer</button>
    </div>

    <script>
        let storageKey = 'cohen_casino_final_v6';
        let data = JSON.parse(localStorage.getItem(storageKey)) || { 
            totalTreasure: 125, 
            currentSpend: 0, 
            lastBonusDate: null 
        };

        const anecdotes = [
            "Le savais-tu ? Un chien peut comprendre jusqu'à 250 mots. Hurricane t'écoute donc très bien ! 🐶",
            "Sourire libère de l'endorphine. Même un faux sourire trompe ton cerveau, alors force un peu ! 😊",
            "Une étude dit que regarder des photos de chiens mignons améliore la concentration. Regarde Gears ! 🐾",
            "Le bonheur ne s'achète pas, mais un petit café en terrasse avec les loulous, ça s'en rapproche. ☕",
            "Chaque jour est une nouvelle chance d'être la meilleure version de soi-même (et la plus riche !). ✨",
            "Les chiens n'ont pas de notion d'argent, pour Eira, tu es déjà milliardaire en câlins. 🤍"
        ];

        function updateDisplay() {
            const now = new Date();
            document.getElementById('date-info').innerText = now.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
            document.getElementById('total-display').innerText = Math.round(data.totalTreasure) + " €";
            
            let remaining = 80 - data.currentSpend;
            document.getElementById('weekly-label').innerText = "Reste : " + remaining.toFixed(2) + " €";
            document.getElementById('battery').style.width = (remaining/80*100) + "%";
            
            // Anecdote du jour (basée sur le jour du mois)
            document.getElementById('anecdote').innerText = "💡 " + anecdotes[now.getDate() % anecdotes.length];

            // Gestion du décompte et du bouton
            const isSaturday = now.getDay() === 6;
            const todayStr = now.toLocaleDateString();
            if (isSaturday && remaining > 0 && data.lastBonusDate !== todayStr) {
                document.getElementById('slot-trigger').style.display = 'block';
                document.getElementById('countdown-area').style.display = 'none';
            } else {
                document.getElementById('slot-trigger').style.display = 'none';
                document.getElementById('countdown-area').style.display = 'block';
                updateCountdown();
            }
        }

        function updateCountdown() {
            const now = new Date();
            let nextSat = new Date();
            nextSat.setDate(now.getDate() + (6 - now.getDay() + 7) % 7);
            nextSat.setHours(0, 0, 0, 0);
            if (now.getDay() === 6) nextSat.setDate(now.getDate() + 7);

            const diff = nextSat - now;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('timer').innerText = `${d}j ${h}h ${m}m ${s}s`;
        }

        function addExpense() {
            let val = parseFloat(document.getElementById('expense').value);
            if (val > 0) {
                data.currentSpend += val;
                data.totalTreasure -= val;
                document.getElementById('expense').value = "";
                save();
            }
        }

        function openSlot() { document.getElementById('slot-modal').style.display = 'flex'; }
        function closeSlot() { document.getElementById('slot-modal').style.display = 'none'; }

        function spin() {
            const symbols = ['🐶', '💎', '💰', '🦴', '🌟'];
            let count = 0;
            let interval = setInterval(() => {
                document.getElementById('r1').innerText = symbols[Math.floor(Math.random()*symbols.length)];
                document.getElementById('r2').innerText = symbols[Math.floor(Math.random()*symbols.length)];
                document.getElementById('r3').innerText = symbols[Math.floor(Math.random()*symbols.length)];
                if(++count > 20) { clearInterval(interval); checkWin(); }
            }, 100);
        }

        function checkWin() {
            let r = [document.getElementById('r1').innerText, document.getElementById('r2').innerText, document.getElementById('r3').innerText];
            if(r[0] === r[1] && r[1] === r[2]) {
                alert("🎰 JACKPOT ! +10€ !");
                data.totalTreasure += 10;
            } else { alert("Hurricane te fait un bisou ! 🐶"); }
            data.lastBonusDate = new Date().toLocaleDateString();
            save();
            setTimeout(closeSlot, 2000);
        }

        function save() { localStorage.setItem(storageKey, JSON.stringify(data)); updateDisplay(); }
        setInterval(updateCountdown, 1000);
        updateDisplay();
    </script>
</body>
</html>
