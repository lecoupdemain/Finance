<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Trésor Cohen</title>
    <style>
        :root { --safe-top: env(safe-area-inset-top); }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: url('fond.jpg') no-repeat center center fixed;
            background-size: cover; color: white; text-align: center; margin: 0; 
            padding: calc(var(--safe-top) + 10px) 15px 20px 15px; min-height: 100vh;
            overflow-x: hidden;
        }
        .card { 
            background: rgba(0, 0, 0, 0.7); border-radius: 25px; padding: 15px; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .dogs-row { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .dog-thumb { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #00ff88; object-fit: cover; }
        .sad-dog { filter: grayscale(100%) brightness(0.7); transform: scale(0.85); border-color: #ff4444; }
        
        .treasure-val { font-size: 3.5rem; color: #00ff88; font-weight: 900; margin: 0; }
        
        /* Conteneur de la jauge */
        .battery-container { border: 2px solid rgba(255,255,255,0.3); border-radius: 15px; height: 35px; margin: 15px 0; background: rgba(0,0,0,0.5); overflow: hidden; }
        .battery-fill { height: 100%; width: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Animation clignotante pour le rouge critique */
        @keyframes blink-red {
            0% { background: #ff4444; box-shadow: 0 0 5px #ff4444; }
            50% { background: #8b0000; box-shadow: 0 0 20px #ff0000; }
            100% { background: #ff4444; box-shadow: 0 0 5px #ff4444; }
        }
        .critical-blink { animation: blink-red 0.8s infinite; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { padding: 18px; border-radius: 16px; border: none; font-size: 18px !important; color: black; background: white; width: 100%; box-sizing: border-box; }
        
        .btn-valider { width: 100%; padding: 20px; border-radius: 18px; border: none; background: #00ff88; color: #1a1a1a; font-weight: 900; font-size: 1.3rem; margin-bottom: 20px; }
        .grade-badge { display: inline-block; padding: 6px 15px; border-radius: 20px; color: #1a1a1a; font-weight: 800; font-size: 0.8rem; margin-top: 10px; }
        .btn-undo { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ff9f0a; background: rgba(255, 159, 10, 0.1); color: #ff9f0a; font-weight: bold; margin-bottom: 10px; }
        .btn-history { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); color: #aaa; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="card">
        <div class="dogs-row">
            <img src="hurricane.png" id="img-hurricane" class="dog-thumb">
            <img src="gears.png" id="img-gears" class="dog-thumb">
            <img src="eira.
