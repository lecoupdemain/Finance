<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Trésor Cohen</title>
    <style>
        :root { --safe-top: env(safe-area-inset-top); }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: url('fond.jpg') no-repeat center center fixed;
            background-size: cover; color: white; text-align: center; margin: 0; 
            padding: calc(var(--safe-top) + 10px) 15px 20px 15px; min-height: 100vh;
            overflow-x: hidden;
        }
        .card { 
            background: rgba(0, 0, 0, 0.75); border-radius: 25px; padding: 15px; 
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            position: relative; z-index: 2;
        }
        .dogs-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; }
        .dog-thumb { width: 65px; height: 65px; border-radius: 50%; border: 3px solid #00ff88; object-fit: cover; }
        .sad-dog { filter: grayscale(100%); transform: scale(0.9); border-color: #ff4444; }
        
        .treasure-val { font-size: 3rem; color: #00ff88; font-weight: 900; margin: 0; }
        .battery-container { border: 2px solid rgba(255,255,255,0.3); border-radius: 15px; height: 25px; margin: 12px 0; background: rgba(0,0,0,0.5); overflow: hidden; }
        .battery-fill { height: 100%; width: 100%; transition: width 0.8s; background: #00ff88; }
        
        /* ICI : La ligne partagée pour Prix et Note */
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-row input { padding: 15px; border-radius: 15px; border: none; font-size: 1rem; color: black; background: white; }
        #expense { flex: 1; min-width: 80px; }
        #note { flex: 2; }
        
        .btn-valider { width: 100%; padding: 18px; border-radius: 18px; border: none; background: #00ff88; color: #1a1a1a; font-weight: 900; font-size: 1.2rem; margin-bottom: 10px; }
        .btn-undo { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #ff9f0a; background: rgba(255, 159, 10, 0.1); color: #ff9f0a; font-weight: bold; margin-bottom: 10px; font-size: 0.85rem; }
        
        #slot-trigger { display: none; width: 100%; padding: 18px; border-radius: 18px; border: 3px solid #ffcc00; background: linear-gradient(45deg, #d4af37, #f44336); color: white; font-weight: 900; margin-top: 10px; animation: pulse 1.5s infinite; }
        
        .countdown-timer { font-family: monospace; font-size: 0.9rem; color: #00d4ff; margin: 5px 0; }
        
        /* Style pour le dicton bien visible */
        .anecdote-box { 
            font-size: 0.95rem; line-height: 1.4; color: #ffcc00; 
            margin-top: 15px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.15);
            font-weight: 500;
        }

        #history-modal, #slot-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding-top: 50px; }
        .coin { position: fixed; top: -50px; font-size: 24px; z-index: 1; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <div class="dogs-row">
            <img src="hurricane.png" id="img-hurricane" class="dog-thumb">
            <img src="gears.png" id="img-gears" class="dog-thumb">
            <img src="eira.png" id="img-eira" class="dog-thumb">
        </div>
        <div id="date-info" style="font-size: 0.8rem; color: #00d4ff; font-weight: bold; text-transform: capitalize;"></div>
        <div class="treasure-val" id="total-display">0 €</div>
        <div id="grade" style="padding: 4px 12px; border-radius: 20px; display: inline-block; background: #00ff88; color: #000; font-weight: bold; font-size: 0.7rem; margin-top: 5px;">Reine du Budget</div>
    </div>

    <div class="card">
        <h3 id="weekly-label" style="margin: 0; font-size: 1.2rem;">Reste : 80 €</h3>
        <div class="battery-container"><div class="battery-fill" id="battery"></div></div>
        
        <div class="input-row">
            <input type="number" id="expense" placeholder="Prix €" inputmode="decimal">
            <input type="text" id="note" placeholder="C'était quoi ?">
        </div>
        
        <button class="btn-valider" onclick="addExpense()">VALIDER L'ACHAT 🚀</button>
        <button class="btn-undo" onclick="undoLast()">ANNULER LE DERNIER ↩️</button>
        <button class="btn-history" onclick="toggleHistory(true)" style="background:none; border:none; color:#aaa; font-size:0.8rem; text-decoration:underline;">📜 Voir l'historique</button>
        
        <button id="slot-trigger" onclick="openSlot()">🎰 MACHINE À SOUS DISPO !</button>
        
        <div id="countdown-area">
            <div id="timer" class="countdown-timer">00j 00h 00m 00s avant le Casino</div>
        </div>
        
        <div id="anecdote" class="anecdote-box"></div>
    </div>

    <div id="history-modal">
        <span onclick="toggleHistory(false)" style="position:fixed; top:20px; right:30px; font-size:3rem; color:red;">×</span>
        <h2 style="color:#00d4ff; text-align:center;">Archives</h2>
        <div id="history-list"></div>
    </div>

    <div id="slot-modal">
        <h2 style="color:#ffcc00;">JACKPOT +10€</h2>
        <div style="display:flex; justify-content:center; gap:10px; margin:30px 0;">
            <div id="r1" style="background:white; width:70px; height:90px; border-radius:10px; color:black; font-size:40px; display:flex; justify-content:center; align-items:center;">❓</div>
            <div id="r2" style="background:white; width:70px; height:90px; border-radius:10px; color:black; font-size:40px; display:flex; justify-content:center; align-items:center;">❓</div>
            <div id="r3" style="background:white; width:70px; height:90px; border-radius:10px; color:black; font-size:40px; display:flex; justify-content:center; align-items:center;">❓</div>
        </div>
        <button onclick="spin()" id="spin-btn" style="padding:15px 40px; border-radius:30px; border:none; background:#ffcc00; font-weight:bold; font-size:1.2rem;">TIRER !</button>
        <button onclick="closeSlot()" style="display:block; margin:20px auto; color:white; background:none; border:none;">Fermer</button>
    </div>

    <script>
        let storageKey = 'cohen_final_v8';
        let data = JSON.parse(localStorage.getItem(storageKey)) || { totalTreasure: 125, currentSpend: 0, history: [], lastBonusDate: null };

        const anecdotes = [
            "Hurricane te surveille : il sait que si tu économises, il aura plus de friandises ! 🐶",
            "Sourire libère de l'endorphine. Gears le fait tous les matins, pourquoi pas toi ? 😊",
            "Le savais-tu ? Les chiens rêvent de leurs propriétaires. Tu es l'héroïne des rêves d'Eira ! 🤍",
            "Chaque euro économisé est un petit pas de plus vers la liberté totale. Courage ! 🚀",
            "La vie est plus belle quand on la regarde avec les yeux d'un chien : tout est une fête ! 🐾",
            "Un petit plaisir par jour éloigne la grisaille. Mais un gros trésor, ça rassure ! 💰"
        ];

        function updateDisplay() {
            const now = new Date();
            document.getElementById('date-info').innerText = now.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
            document.getElementById('total-display').innerText = Math.round(data.totalTreasure) + " €";
            
            let remaining = 80 - data.currentSpend;
            document.getElementById('weekly-label').innerText = "Reste : " + remaining.toFixed(2) + " €";
            document.getElementById('battery').style.width = (remaining/80*100) + "%";
            
            let dogs = [document.getElementById('img-hurricane'), document.getElementById('img-gears'), document.getElementById('img-eira')];
            if(remaining <= 0) dogs.forEach(d => d.classList.add('sad-dog'));
            else dogs.forEach(d => d.classList.remove('sad-dog'));

            document.getElementById('anecdote').innerText = "💡 Dicton du jour : " + anecdotes[now.getDate() % anecdotes.length];

            const isSaturday = now.getDay() === 6;
            if(isSaturday && remaining > 0 && data.lastBonusDate !== now.toLocaleDateString()) {
                document.getElementById('slot-trigger').style.display = 'block';
                document.getElementById('countdown-area').style.display = 'none';
            } else {
                document.getElementById('slot-trigger').style.display = 'none';
                document.getElementById('countdown-area').style.display = 'block';
                updateCountdown();
            }

            let histHtml = "";
            data.history.slice().reverse().forEach(item => {
                histHtml += `<div style="background:rgba(255,255,255,0.05); margin:10px 20px; padding:10px; border-radius:10px; display:flex; justify-content:space-between;"><div><b>${item.date}</b><br>${item.note}</div><div style="color:#ff4444">-${item.amount}€</div></div>`;
            });
            document.getElementById('history-list').innerHTML = histHtml || "<p>Aucun achat</p>";
        }

        function updateCountdown() {
            const now = new Date();
            let nextSat = new Date();
            nextSat.setDate(now.getDate() + (6 - now.getDay() + 7) % 7);
            nextSat.setHours(0,0,0,0);
            if(now.getDay() === 6) nextSat.setDate(now.getDate() + 7);
            const diff = nextSat - now;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer').innerText = `${d}j ${h}h ${m}m ${s}s avant le Casino`;
        }

        function addExpense() {
            let p = document.getElementById('expense');
            let n = document.getElementById('note');
            let val = parseFloat(p.value);
            if (val > 0) {
                data.currentSpend += val;
                data.totalTreasure -= val;
                data.history.push({ amount: val, note: n.value || "Achat", date: new Date().toLocaleDateString() });
                p.value = ""; n.value = "";
                save();
                for(let i=0; i<20; i++) setTimeout(createCoin, i*100);
            }
        }

        function undoLast() {
            if(data.history.length > 0 && confirm("Annuler le dernier achat ?")) {
                let last = data.history.pop();
                data.currentSpend -= last.amount;
                data.totalTreasure += last.amount;
                save();
            }
        }

        function createCoin() {
            const coin = document.createElement('div');
            coin.classList.add('coin');
            coin.innerText = '💰';
            coin.style.left = Math.random() * 100 + "vw";
            coin.style.animationDuration = (Math.random() * 2 + 1) + "s";
            document.body.appendChild(coin);
            setTimeout(() => coin.remove(), 3000);
        }

        function spin() {
            const s = ['🐶','💎','💰','🦴'];
            let c = 0;
            let iv = setInterval(() => {
                document.getElementById('r1').innerText = s[Math.floor(Math.random()*4)];
                document.getElementById('r2').innerText = s[Math.floor(Math.random()*4)];
                document.getElementById('r3').innerText = s[Math.floor(Math.random()*4)];
                if(++c > 20) { 
                    clearInterval(iv);
                    if(document.getElementById('r1').innerText === document.getElementById('r2').innerText && document.getElementById('r2').innerText === document.getElementById('r3').innerText) {
                        alert("JACKPOT ! +10€"); data.totalTreasure += 10;
                    } else { alert("Pas cette fois ! 🐶"); }
                    data.lastBonusDate = new Date().toLocaleDateString();
                    save(); setTimeout(closeSlot, 2000);
                }
            }, 100);
        }

        function toggleHistory(s) { document.getElementById('history-modal').style.display = s ? 'block' : 'none'; }
        function openSlot() { document.getElementById('slot-modal').style.display = 'flex'; }
        function closeSlot() { document.getElementById('slot-modal').style.display = 'none'; }
        function save() { localStorage.setItem(storageKey, JSON.stringify(data)); updateDisplay(); }
        
        setInterval(updateCountdown, 1000);
        updateDisplay();
    </script>
</body>
</html>
